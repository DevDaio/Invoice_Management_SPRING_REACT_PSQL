name: "Debug Secrets"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check secret lengths
        env:
          AKID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SAK: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID length: ${#AKID}"
          echo "AWS_SECRET_ACCESS_KEY length: ${#SAK}"
          echo "AKID ends with newline? $(echo -n "$AKID" | od -c | tail -1 | grep -c '\\n' || true)"
          echo "First 4 chars AKID: ${AKID:0:4}"
          echo "First 4 chars SAK: ${SAK:0:4}"
